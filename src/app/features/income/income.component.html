<div class="income-container">
  <div class="header">
    <div class="header-text">
      <h1>Einnahmen verwalten</h1>
      <p>Alle Einkommensquellen und Prognosen</p>
    </div>
    <button class="btn-primary">
      <span class="material-icons-outlined">add</span>
      Neue Einnahme
    </button>
  </div>

  <div class="view-toggle">
    <button class="toggle-btn active">
      <span class="material-icons-outlined">list</span> Übersicht
    </button>
    <button class="toggle-btn">
      <span class="material-icons-outlined">auto_graph</span> Prognose
    </button>
  </div>

  <div class="stats-grid">
    <div class="stats-card">
      <div class="stats-info">
        <h3>Tatsächliche Einnahmen</h3>
        <span class="amount green">0.00 €</span>
      </div>
    </div>
    
    <div class="stats-card planned-card">
      <div class="stats-info">
        <div class="stats-title-wrapper">
          <span class="material-icons-outlined icon-orange">auto_awesome</span>
          <h3>Geplante Einnahmen</h3>
        </div>
        <span class="amount orange">0.00 €</span>
      </div>
    </div>
  </div>

  <div class="empty-card">
    <div class="empty-content">
      <span class="material-icons-outlined mailbox-icon">inventory_2</span>
      <p>Noch keine Einnahmen vorhanden</p>
    </div>
  </div>
</div>
